<div class="auth-topbar">
    <a href="" class="auth-brand">JobTrackr</a>
</div>

<div class="auth-container">
    <mat-card class="auth-card">
        <mat-card-header>
            <mat-card-title>Login to JobTrackr</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()">
                <mat-form-field appearance="outline" class="full-width compact-fields">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" autocomplete="email">
                    @if (form.get('email')?.hasError('email')) {
                        <mat-error>Enter a valid email</mat-error>
                    }
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width compact-fields">
                    <mat-label>Password</mat-label>
                    <input
                        matInput
                        formControlName="password"
                        [type]="showPassword()? 'text': 'password'"
                        autocomplete="current-password">
                    <button
                        mat-icon-button
                        matSuffix
                        type="button"
                        (click)="showPassword.update(v => !v)"
                        [attr.aria-label]="showPassword() ? 'Hide Password' : 'Show Password'">
                        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>    
                    </button>
                    @if (form.get('password')?.hasError('password')) {
                        <mat-error>Password is required</mat-error>
                    }
                </mat-form-field>

                @if (error()) {
                    <p class="error-text">{{ error() }}</p>
                }

                <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="full-width">
                    @if (loading()) {
                        <mat-spinner diameter="20"/>
                    } @else { Login }
                </button>

                <div class="oauth-divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">OR</span>
                    <span class="divider-line"></span>
                </div>

                <button mat-stroked-button type="button" class="full-width google-btn" (click)="loginWithGoogle()">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <span>Don't have an account?</span>
            <a mat-button routerLink="/register">Register</a>
        </mat-card-actions>
    </mat-card>
</div>
