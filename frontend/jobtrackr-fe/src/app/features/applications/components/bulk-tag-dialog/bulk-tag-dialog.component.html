<h2 mat-dialog-title>Add Tags to {{ data.selectedCount }} Applications</h2>
<mat-dialog-content>
    <app-tag-input (tagsChange)="onTagsChange($event)" />
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button
        mat-flat-button
        color="primary"
        [disabled]="tags().length === 0"
        (click)="confirm()">
        Add Tags
    </button>
</mat-dialog-actions>
