spring.application.name=application-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/jobtrackr_applications
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JD-117: disable Open Session In View - all lazy access is audited to occur
# within explicit @Transactional boundaries (see ApplicationServiceImpl)
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.cloud.openfeign.circuitbreaker.enabled=true

# --- Correlation ID logging (JD-37) ---
# Plugs into Spring Boot's own built-in correlation slot in the default console pattern,
# instead of hand-maintaining the entire pattern (which caused malformed spacing earlier).
logging.pattern.correlation=[%X{correlationId:-}]
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
