# --- Production profile: API Gateway ---
# No Eureka in prod ? routing uses fixed URLs instead (see app.services.* and
# GatewayRoutesProdConfig).
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# Eureka's client autoconfiguration still gets evaluated at boot even with the
# flags above (confirmed via prod logs: DiscoveryClientOptionalArgsConfiguration
# still initializes an unused RestClient-based transport). Excluding it outright
# skips that work and shaves startup time. Since spring-cloud-starter-netflix-eureka-client
# stays on the classpath for local/docker profiles, this exclude is prod-only.
spring.autoconfigure.exclude=\
  org.springframework.cloud.netflix.eureka.config.DiscoveryClientOptionalArgsConfiguration,\
  org.springframework.cloud.loadbalancer.config.LoadBalancerAutoConfiguration,\
  org.springframework.cloud.loadbalancer.config.BlockingLoadBalancerClientAutoConfiguration,\
  org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration
spring.cloud.gateway.server.webmvc.httpclient.connect-timeout=10s
spring.cloud.gateway.server.webmvc.httpclient.socket-timeout=180s
server.tomcat.connection-timeout=190s

# --- Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- Downstream service URLs (Render) ? used by GatewayRoutesProdConfig ---
app.services.user-service-url=${USER_SERVICE_URL}
app.services.application-service-url=${APPLICATION_SERVICE_URL}

# --- CORS ---
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# --- JWT secret (must match User Service exactly) ---
app.jwt.secret=${JWT_SECRET}

logging.level.com.jobtrackr.api_gateway=INFO