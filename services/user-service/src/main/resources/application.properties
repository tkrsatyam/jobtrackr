spring.application.name=user-service
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JD-117: disable Open Session In View. AuthService.refresh() previously relied
# on OSIV to access RefreshToken.getUser() lazily outside a transaction - fixed
# by making that method @Transactional (see AuthService).
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET}

#TODO: Change the access token expiration after testing is done
#for production
#jwt.access-token-expiration=900000

#for dev and testing
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=email,profile

management.endpoints.web.exposure.include=health,info

# --- Correlation ID logging (JD-37) ---
# Plugs into Spring Boot's own built-in correlation slot in the default console pattern,
# instead of hand-maintaining the entire pattern (which caused malformed spacing earlier).
logging.pattern.correlation=[%X{correlationId:-}]