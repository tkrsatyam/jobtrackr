# --- Production profile: Application Service ---

# --- Service client URLs (Docker container DNS) ---
app.services.document-service-url=${DOCUMENT_SERVICE_URL:http://document-service:8084}

# --- Database (Neon) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=application-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

spring.jpa.show-sql=false

logging.level.com.jobtrackr.application_service=INFO
