name: BE - Keep Services Warm

on:
  schedule:
    - cron: '0,10,20,30,40,50 5-10 * * 1-5'
    - cron: '0,10,20,30 11 * * 1-5'
  workflow_dispatch:

jobs:
  ping-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check if within active window
        id: window
        run: |
          current_time=$(date -u +%H%M)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( 10#$current_time <= 1130 )); then
            echo "should_ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_ping=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ping Gateway
        if: steps.window.outputs.should_ping == 'true'
        run: curl -sf -o /dev/null -w "%{http_code}" https://jobtrackr-gateway.onrender.com/ping

  ping-user-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check if within active window
        id: window
        run: |
          current_time=$(date -u +%H%M)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( 10#$current_time <= 1130 )); then
            echo "should_ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_ping=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ping User Service
        if: steps.window.outputs.should_ping == 'true'
        run: curl -sf -o /dev/null -w "%{http_code}" https://jobtrackr-user-service.onrender.com/ping

  ping-application-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check if within active window
        id: window
        run: |
          current_time=$(date -u +%H%M)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( 10#$current_time <= 1130 )); then
            echo "should_ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_ping=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ping Application Service
        if: steps.window.outputs.should_ping == 'true'
        run: curl -sf -o /dev/null -w "%{http_code}" https://jobtrackr-application-service.onrender.com/ping