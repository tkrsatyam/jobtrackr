spring.datasource.url=jdbc:h2:mem:appservicetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
jobtrackr.kafka.topics.application-discovered=application-discovered
jobtrackr.kafka.topics.application-created=application-created
jobtrackr.kafka.topics.status-updated=status-updated
jobtrackr.kafka.topics.application-deleted=application-deleted
spring.kafka.bootstrap-servers=localhost:9092
