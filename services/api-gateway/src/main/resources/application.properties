spring.application.name=api-gateway
server.port=8080

# --- Forwarded headers for reverse proxy (Caddy / Cloudflare) ---
server.forward-headers-strategy=framework

spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JWT secret (must match User Service exactly) ---
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# --- Rate limiting (JD-36) ---
# Per authenticated user, applied on secured routes once the JWT has been validated.
app.rate-limit.requests-per-minute=100
# Per client IP, applied on open routes (login/register/etc.) to slow down brute force attempts.
app.rate-limit.ip-requests-per-minute=20

# --- Correlation ID logging (JD-37) ---
# Plugs into Spring Boot's own built-in correlation slot in the default console pattern,
# instead of hand-maintaining the entire pattern (which caused malformed spacing earlier).
logging.pattern.correlation=[%X{correlationId:-}]

# --- Microservice routing endpoints (local development defaults) ---
app.services.user-service-url=http://localhost:8081
app.services.application-service-url=http://localhost:8082
app.services.reminder-service-url=http://localhost:8083
app.services.document-service-url=http://localhost:8084
app.services.contact-service-url=http://localhost:8085
app.services.notification-service-url=http://localhost:8086
app.services.analytics-service-url=http://localhost:8087
app.services.email-ingestion-service-url=http://localhost:8088
