spring.application.name=api-gateway
server.port=8080

spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JWT secret (must match User Service exactly) ---
app.jwt.secret=${JWT_SECRET}

# --- Correlation ID logging (JD-37) ---
# Plugs into Spring Boot's own built-in correlation slot in the default console pattern,
# instead of hand-maintaining the entire pattern (which caused malformed spacing earlier).
logging.pattern.correlation=[%X{correlationId:-}]