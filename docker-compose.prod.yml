services:

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-tkrsatyam}/jobtrackr-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200,https://jobtrackr.vercel.app}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 300M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  user-service:
    image: ${DOCKERHUB_USERNAME:-tkrsatyam}/jobtrackr-user-service:latest
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms64m -Xmx192m -XX:MaxMetaspaceSize=112m
      - DB_URL=${USER_DB_URL}
      - DB_USERNAME=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://jobtrackr.vercel.app}
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 450M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  application-service:
    image: ${DOCKERHUB_USERNAME:-tkrsatyam}/jobtrackr-application-service:latest
    container_name: application-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m
      - DB_URL=${APP_DB_URL}
      - DB_USERNAME=${APP_DB_USERNAME}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      - KAFKA_SASL_JAAS_CONFIG=${KAFKA_SASL_JAAS_CONFIG}
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 550M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  email-ingestion-service:
    image: ${DOCKERHUB_USERNAME:-tkrsatyam}/jobtrackr-email-ingestion-service:latest
    container_name: email-ingestion-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m
      - DB_URL=${INGESTION_DB_URL}
      - DB_USERNAME=${INGESTION_DB_USERNAME}
      - DB_PASSWORD=${INGESTION_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      - KAFKA_SASL_JAAS_CONFIG=${KAFKA_SASL_JAAS_CONFIG}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INGESTION_SCHEDULER_ENABLED=${INGESTION_SCHEDULER_ENABLED:-true}
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 550M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8088/api/ingestion/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

networks:
  jobtrackr-network:
    name: jobtrackr-network
    driver: bridge
