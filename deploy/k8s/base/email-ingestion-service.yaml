apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-ingestion-service
  labels:
    app: email-ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-ingestion-service
  template:
    metadata:
      labels:
        app: email-ingestion-service
    spec:
      containers:
        - name: email-ingestion-service
          image: jobtrackr-email-ingestion-service:latest
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/jobtrackr_ingestion"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jobtrackr-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtrackr-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: REDIS_URL
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: SPRING_DATA_REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobtrackr-secrets
                  key: GEMINI_API_KEY
            - name: INGESTION_SCHEDULER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: jobtrackr-config
                  key: INGESTION_SCHEDULER_ENABLED
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: email-ingestion-service
  labels:
    app: email-ingestion-service
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  selector:
    app: email-ingestion-service
