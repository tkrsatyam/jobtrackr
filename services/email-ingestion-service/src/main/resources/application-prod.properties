# --- Production profile: Email Ingestion Service ---

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- Kafka (Upstash) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# --- Gemini API ---
spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.jpa.show-sql=false
logging.level.com.jobtrackr.email_ingestion_service=INFO
