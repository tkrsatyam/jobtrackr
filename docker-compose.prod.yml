services:

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "4L622nShTUiGHLSkiEGQHQ"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1024m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - jobtrackr-network

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-satyamk07}/jobtrackr-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx768m
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200,https://jobtrackr.vercel.app}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  user-service:
    image: ${DOCKERHUB_USERNAME:-satyamk07}/jobtrackr-user-service:latest
    container_name: user-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx1536m
      - DB_URL=${USER_DB_URL}
      - DB_USERNAME=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://jobtrackr-api.duckdns.org/api/auth/oauth2/code/google}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://jobtrackr.vercel.app}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  application-service:
    image: ${DOCKERHUB_USERNAME:-satyamk07}/jobtrackr-application-service:latest
    container_name: application-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx1536m
      - DB_URL=${APP_DB_URL}
      - DB_USERNAME=${APP_DB_USERNAME}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-PLAIN}
      - KAFKA_SASL_JAAS_CONFIG=${KAFKA_SASL_JAAS_CONFIG:-}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

  email-ingestion-service:
    image: ${DOCKERHUB_USERNAME:-satyamk07}/jobtrackr-email-ingestion-service:latest
    container_name: email-ingestion-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx1536m
      - DB_URL=${INGESTION_DB_URL}
      - DB_USERNAME=${INGESTION_DB_USERNAME}
      - DB_PASSWORD=${INGESTION_DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-PLAIN}
      - KAFKA_SASL_JAAS_CONFIG=${KAFKA_SASL_JAAS_CONFIG:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INGESTION_SCHEDULER_ENABLED=${INGESTION_SCHEDULER_ENABLED:-true}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8088/api/ingestion/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jobtrackr-network

volumes:
  kafka-data:
    name: jobtrackr-kafka-data

networks:
  jobtrackr-network:
    name: jobtrackr-network
    driver: bridge
