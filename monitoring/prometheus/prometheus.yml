global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'api-gateway'

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8081']
        labels:
          application: 'user-service'

  - job_name: 'application-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['application-service:8082']
        labels:
          application: 'application-service'

  - job_name: 'email-ingestion-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['email-ingestion-service:8088']
        labels:
          application: 'email-ingestion-service'
