# --- Production profile: Email Ingestion Service ---

# --- Service client URLs (Docker container DNS) ---
app.services.user-service-url=${USER_SERVICE_URL:http://user-service:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# --- Gemini API ---
spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.jpa.show-sql=false
logging.level.com.jobtrackr.email_ingestion_service=INFO
