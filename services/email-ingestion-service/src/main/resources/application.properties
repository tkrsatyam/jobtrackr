spring.application.name=email-ingestion-service
server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrackr_ingestion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=email-ingestion-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jobtrackr.ingestion.poll-interval-ms=${JOBTRACKR_INGESTION_POLL_INTERVAL_MS:10800000}
jobtrackr.ingestion.scheduler.enabled=${INGESTION_SCHEDULER_ENABLED:false}

logging.pattern.correlation=[%X{correlationId:-}]

spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
jobtrackr.ai.models=${GEMINI_MODELS:gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-2.5-flash-lite,gemini-3.8-flash}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
