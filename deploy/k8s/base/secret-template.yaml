# =============================================================================
# JobTrackr Kubernetes Secret Template
# =============================================================================
# Instructions:
# 1. Fill in actual values for your target environment.
# 2. Apply via: kubectl apply -f secret.yaml -n <target-namespace>
# 3. Alternatively, generate using kubectl CLI:
#    kubectl create secret generic jobtrackr-secrets \
#      --from-literal=JWT_SECRET="your-256-bit-secret" \
#      --from-literal=GOOGLE_CLIENT_ID="your-client-id" \
#      --from-literal=GOOGLE_CLIENT_SECRET="your-client-secret" \
#      --from-literal=ENCRYPTION_KEY="your-32-char-key" \
#      --from-literal=GEMINI_API_KEY="your-gemini-key" \
#      --from-literal=POSTGRES_USER="postgres" \
#      --from-literal=POSTGRES_PASSWORD="postgres-password" \
#      -n jobtrackr
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: jobtrackr-secrets
type: Opaque
stringData:
  JWT_SECRET: "your-jwt-secret-min-32-characters-long"
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-oauth-client-secret"
  ENCRYPTION_KEY: "your-32-character-encryption-key"
  GEMINI_API_KEY: "your-gemini-api-key"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
