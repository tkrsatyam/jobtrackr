# --- Production profile: API Gateway ---

spring.cloud.gateway.server.webmvc.httpclient.connect-timeout=10s
spring.cloud.gateway.server.webmvc.httpclient.socket-timeout=180s
server.tomcat.connection-timeout=190s

# --- Redis (Upstash) ---
spring.data.redis.url=${REDIS_URL}

# --- CORS ---
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,https://jobtrackr-portal.vercel.app}

# --- JWT secret (must match User Service exactly) ---
app.jwt.secret=${JWT_SECRET}

# --- Downstream service URLs (Docker container names) ---
app.services.user-service-url=${USER_SERVICE_URL:http://user-service:8081}
app.services.application-service-url=${APPLICATION_SERVICE_URL:http://application-service:8082}
app.services.email-ingestion-service-url=${EMAIL_INGESTION_SERVICE_URL:http://email-ingestion-service:8088}
app.services.reminder-service-url=${REMINDER_SERVICE_URL:http://reminder-service:8083}
app.services.document-service-url=${DOCUMENT_SERVICE_URL:http://document-service:8084}
app.services.contact-service-url=${CONTACT_SERVICE_URL:http://contact-service:8085}
app.services.notification-service-url=${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
app.services.analytics-service-url=${ANALYTICS_SERVICE_URL:http://analytics-service:8087}

logging.level.com.jobtrackr.api_gateway=INFO
